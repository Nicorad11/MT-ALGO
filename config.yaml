# Opus Trader configuration.
# Edited by the Settings screen as well; changes apply from the next bar.
# Every change made in the app is also logged in data/opus_trader.sqlite (settings_log).

# --- App ---
app:
  # Symbol to trade.
  symbol: EURUSD
  # Magic number on every bot order. Positions without it are never touched.
  magic: 551155
  # true: simulated fills, no orders are sent to MT5.
  dry_run: true
  # Seconds after the M15 close before building the snapshot.
  bar_delay_s: 5
  # Local port for the UI server (127.0.0.1 only).
  server_port: 8765

# --- Risk ---
risk:
  # Equity risked per trade, in percent.
  risk_per_trade_pct: 0.5
  # Bot loss (realized + open) that halts trading until 17:00 New York, in percent of start-of-day equity.
  daily_loss_limit_pct: 2.0
  # Maximum open bot positions (fixed at 1).
  max_open_positions: 1
  # Maximum new entries per trading day (17:00 to 17:00 New York).
  max_trades_per_day: 6
  # Minimum stop distance as a multiple of ATR(14) on M15.
  min_stop_atr: 0.5
  # Maximum stop distance as a multiple of ATR(14) on M15.
  max_stop_atr: 3.0
  # Minimum take-profit distance divided by stop distance.
  min_reward_risk: 1.5
  # Skip the bar when the spread is wider than this, in pips.
  max_spread_pips: 1.5
  # Bars to wait before a new entry after a losing trade.
  cooldown_bars_after_loss: 2
  # Limit orders expire after this many M15 bars.
  limit_expiry_bars: 4
  # Maximum slippage for market orders, in points (10 points = 1 pip).
  deviation_points: 10

# --- Schedule ---
schedule:
  # No new entries after this time on Friday (UTC, HH:MM).
  friday_no_entries_utc: '19:00'
  # Close bot positions and cancel bot orders at this time on Friday (UTC, HH:MM).
  friday_flat_utc: '20:30'
  # Model calls resume at this time on Sunday (UTC, HH:MM).
  sunday_resume_utc: '23:00'

# --- News ---
news:
  # Minutes before a high-impact event with no model calls.
  blackout_before_min: 30
  # Minutes after a high-impact event with no model calls.
  blackout_after_min: 15
  # High-impact events file (relative to the project folder).
  events_file: events.yaml
  # Currencies whose high-impact events trigger a blackout.
  currencies: [USD, EUR]

# --- Trend Signals ---
signal:
  # input: the model may use or ignore the Trend Signals indicator. filter: entries only in the direction of a recent flip.
  mode: input
  # In filter mode, a flip counts as recent if it happened within this many closed bars.
  filter_bars: 2
  # Trend Signals ATR length.
  atr_length: 14
  # Trend Signals ATR multiplier for the trailing line.
  multiplier: 2.0
  # 1 = Wilder's RMA of true range (Pine ta.atr). 2 = simple moving average of true range.
  atr_method: 1

# --- Model ---
model:
  # Anthropic model ID.
  model: claude-opus-5-5
  # Reasoning effort per decision. Higher is more thorough and costs more.
  effort: high
  # Seconds to wait for a decision before treating the bar as HOLD.
  timeout_s: 120
  # Maximum output tokens per decision (thinking included).
  max_tokens: 16000
  # USD per million uncached input tokens.
  price_input_per_mtok: 4.0
  # USD per million output tokens.
  price_output_per_mtok: 20.0
  # USD per million cached input tokens read.
  price_cache_read_per_mtok: 0.2
  # USD per million input tokens written to the 1-hour cache.
  price_cache_write_1h_per_mtok: 8.0
